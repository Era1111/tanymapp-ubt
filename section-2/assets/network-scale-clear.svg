<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Компьютерлік желі ауқымы"><rect width="1000" height="540" rx="34" fill="#f7f5ff"/><text x="48" y="62" fill="#292356" font-family="Arial,sans-serif" font-size="34" font-weight="700">Компьютерлік желі ауқымы</text><text x="48" y="99" fill="#5e5875" font-family="Arial,sans-serif" font-size="20">Қамтитын аумағына қарап ажырат</text><rect x="48" y="145" width="280" height="280" rx="22" fill="#e2f7ef" stroke="#ded8f5" stroke-width="2"/><text x="70" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">LAN</text><text x="70" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Үй немесе сынып</text><text x="70" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Бір ғимарат</text><text x="70" y="291" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Жергілікті желі</text><rect x="360" y="145" width="280" height="280" rx="22" fill="#fff0d7" stroke="#ded8f5" stroke-width="2"/><text x="382" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">MAN</text><text x="382" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Қала аумағы</text><text x="382" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Бірнеше LAN</text><text x="382" y="291" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Қалалық желі</text><rect x="672" y="145" width="280" height="280" rx="22" fill="#eadfff" stroke="#ded8f5" stroke-width="2"/><text x="694" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">WAN</text><text x="694" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Қалалар, елдер</text><text x="694" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Көптеген желі</text><text x="694" y="291" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Интернет мысалы</text></svg>