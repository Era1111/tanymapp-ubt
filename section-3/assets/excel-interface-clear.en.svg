<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Excel терезесінің бөліктері"><rect width="1000" height="540" rx="34" fill="#f7f5ff"/><text x="48" y="62" fill="#292356" font-family="Arial,sans-serif" font-size="34" font-weight="700">Parts of the Excel window</text><text x="48" y="99" fill="#5e5875" font-family="Arial,sans-serif" font-size="20">Find the address and formula bar</text><rect x="48" y="140" width="430" height="130" rx="22" fill="#e2f7ef" stroke="#ded8f5" stroke-width="2"/><text x="70" y="182" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">A, B, C — columns</text><text x="70" y="224" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Cells from top to bottom</text><rect x="522" y="140" width="430" height="130" rx="22" fill="#fff0d7" stroke="#ded8f5" stroke-width="2"/><text x="544" y="182" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">1, 2, 3 — rows</text><text x="544" y="224" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Cells from left to right</text><rect x="48" y="310" width="430" height="130" rx="22" fill="#eadfff" stroke="#ded8f5" stroke-width="2"/><text x="70" y="352" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">B2 — cell address</text><text x="70" y="394" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Column B + row 2</text><rect x="522" y="310" width="430" height="130" rx="22" fill="#e8f3ff" stroke="#ded8f5" stroke-width="2"/><text x="544" y="352" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">Formula bar</text><text x="544" y="394" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Active cell content</text></svg>