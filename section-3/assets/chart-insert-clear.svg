<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Диаграмма құру қадамдары"><rect width="1000" height="540" rx="34" fill="#f7f5ff"/><text x="48" y="62" fill="#292356" font-family="Arial,sans-serif" font-size="34" font-weight="700">Диаграмма құру қадамдары</text><text x="48" y="99" fill="#5e5875" font-family="Arial,sans-serif" font-size="20">Тауар атауы мен сан мәнін салыстыр</text><rect x="48" y="145" width="280" height="280" rx="22" fill="#e2f7ef" stroke="#ded8f5" stroke-width="2"/><text x="70" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">1. Белгіле</text><text x="70" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">A1:B4 аралығы</text><text x="70" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Атаулар және сандар</text><rect x="360" y="145" width="280" height="280" rx="22" fill="#fff0d7" stroke="#ded8f5" stroke-width="2"/><text x="382" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">2. Кірістіру</text><text x="382" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Insert / Вставка</text><text x="382" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Бағандық диаграмма</text><rect x="672" y="145" width="280" height="280" rx="22" fill="#eadfff" stroke="#ded8f5" stroke-width="2"/><text x="694" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">3. Тексеру</text><text x="694" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">X осі: тауар</text><text x="694" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Y осі: сан мәні</text></svg>