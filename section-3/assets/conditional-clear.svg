<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Шартты пішімдеу"><rect width="1000" height="540" rx="34" fill="#f7f5ff"/><text x="48" y="62" fill="#292356" font-family="Arial,sans-serif" font-size="34" font-weight="700">Шартты пішімдеу</text><text x="48" y="99" fill="#5e5875" font-family="Arial,sans-serif" font-size="20">50-ден төмен мәндерді ғана боя</text><rect x="48" y="145" width="280" height="280" rx="22" fill="#ffe3e0" stroke="#ded8f5" stroke-width="2"/><text x="70" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">45</text><text x="70" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">45 &lt; 50</text><text x="70" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Қызыл түспен белгіле</text><rect x="360" y="145" width="280" height="280" rx="22" fill="#fff" stroke="#ded8f5" stroke-width="2"/><text x="382" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">50</text><text x="382" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">50 &lt; 50 — жалған</text><text x="382" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Түсі өзгермейді</text><rect x="672" y="145" width="280" height="280" rx="22" fill="#fff" stroke="#ded8f5" stroke-width="2"/><text x="694" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">70</text><text x="694" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">70 &lt; 50 — жалған</text><text x="694" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Түсі өзгермейді</text></svg>