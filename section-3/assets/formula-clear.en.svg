<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Формула қалай есептеледі?"><rect width="1000" height="540" rx="34" fill="#f7f5ff"/><text x="48" y="62" fill="#292356" font-family="Arial,sans-serif" font-size="34" font-weight="700">How is the formula calculated?</text><text x="48" y="99" fill="#5e5875" font-family="Arial,sans-serif" font-size="20">Let B2 = 250 and C2 = 3</text><rect x="48" y="145" width="280" height="280" rx="22" fill="#e2f7ef" stroke="#ded8f5" stroke-width="2"/><text x="70" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">B2</text><text x="70" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Price</text><text x="70" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">250 ₸</text><rect x="360" y="145" width="280" height="280" rx="22" fill="#fff0d7" stroke="#ded8f5" stroke-width="2"/><text x="382" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">C2</text><text x="382" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Quantity</text><text x="382" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">3</text><rect x="672" y="145" width="280" height="280" rx="22" fill="#eadfff" stroke="#ded8f5" stroke-width="2"/><text x="694" y="187" fill="#292356" font-family="Arial,sans-serif" font-size="25" font-weight="700">D2</text><text x="694" y="229" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">=B2*C2</text><text x="694" y="260" fill="#3e3856" font-family="Arial,sans-serif" font-size="20">Result: 750 ₸</text></svg>